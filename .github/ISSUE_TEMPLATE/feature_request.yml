name: Feature 请求
description: 提议一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 你希望怎么实现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
