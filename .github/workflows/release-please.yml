# 推送 Conventional Commits 到 main/test 后，由 release-please 分别创建 stable/rc Release PR。
# 单 Rust crate 在根 Cargo.toml 声明 package.version；release-type: rust 会更新 manifest。
# GitHub App token 由组织自托管 runner 凭证提供；缺少时 workflow 回退 GITHUB_TOKEN。
# 调用 nsfintech/.github 的可复用 workflow。
name: release-please

on:
  push:
    branches: [main, test]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-cargo:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.cargo.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect root Cargo manifest
        id: cargo
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml; release-please is skipped."
          fi

  release-please:
    needs: detect-cargo
    if: needs.detect-cargo.outputs.present == 'true'
    uses: nsfintech/.github/.github/workflows/release-please.yml@v1
    with:
      release-type: rust
      prerelease: ${{ github.ref_name == 'test' }}
      prerelease-type: rc
      sync-back-to: ${{ github.ref_name == 'main' && 'test' || '' }}
    secrets: inherit
