# 推送 Conventional Commits 到 main 后，由 release-please 创建稳定版 Release PR。
# 单 Rust crate 应在根 Cargo.toml 声明 package.version；release-type: rust
# 会更新该 manifest 并生成 vX.Y.Z tag。当前尚无 Cargo manifest，首次版本尚待确定。
# GitHub App token 由组织自托管 runner 凭证提供；缺少时 workflow 回退 GITHUB_TOKEN。
# 调用 nsfintech/.github 的可复用 workflow。
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-cargo:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.cargo.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect root Cargo manifest
        id: cargo
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml yet; release-please will run after the SDK manifest is added."
          fi

  release-please:
    needs: detect-cargo
    if: needs.detect-cargo.outputs.present == 'true'
    uses: nsfintech/.github/.github/workflows/release-please.yml@v1
    with:
      release-type: rust
      # This repository currently uses only main; disable the organization
      # default sync-back to test for this single-branch model.
      sync-back-to: ''
    secrets: inherit
