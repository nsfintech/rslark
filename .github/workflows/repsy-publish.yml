# Disabled unless repository variables explicitly enable publishing and confirm
# the crate list and Repsy credentials are ready. Configure these variables in
# Settings -> Secrets and variables -> Actions: REPSY_PUBLISH_ENABLED,
# REPSY_CREDENTIALS_READY, and REPSY_CARGO_PUBLISH_CRATES.
name: repsy-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-cargo:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.cargo.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect root Cargo manifest
        id: cargo
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml yet; skipping Repsy publish until crate names are known."
          fi

  repsy:
    needs: detect-cargo
    if: >-
      needs.detect-cargo.outputs.present == 'true' &&
      vars.REPSY_PUBLISH_ENABLED == 'true' &&
      vars.REPSY_CREDENTIALS_READY == 'true' &&
      vars.REPSY_CARGO_PUBLISH_CRATES != ''
    uses: nsfintech/.github/.github/workflows/repsy-publish.yml@v1
    with:
      publish-cargo: true
      publish-npm: false
      publish-pypi: false
      cargo-publish-crates: ${{ vars.REPSY_CARGO_PUBLISH_CRATES }}
      require-branch: test,main
