[package]
name = "rslark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Rust SDK for Feishu and Lark"
repository = "https://github.com/nsfintech/rslark"
readme = "README.md"

[features]
default = ["tokio", "http", "websocket", "serde", "protobuf"]
tokio = ["dep:tokio"]
http = ["dep:reqwest"]
websocket = ["dep:tokio-tungstenite"]
serde = ["dep:serde", "dep:serde_json"]
protobuf = ["dep:prost"]

[dependencies]
prost = { version = "0.13", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
