# Per-repository cargo-deny policy. This applies once the SDK Cargo package
# is added; the repository currently has no Cargo manifest.

[advisories]
version = 2
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = [
    { name = "openssl", reason = "Use rustls based TLS dependencies." },
    { name = "openssl-sys", reason = "Use rustls based TLS dependencies." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
